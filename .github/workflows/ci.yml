name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_call: # reused by pages.yml so a deploy can never skip the gates

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage # fails under the coverage thresholds (NFR-09)
      - run: npm run check:privacy # no real customer identifiers in the repo (ADR-0007)
      - run: npm run check:traceability # every built story / test-verified NFR is named in a test
      - run: npm run build
      - run: npm run check:bundle-size # NFR-08
      - run: npm audit --audit-level=high # NFR-10: fails on high/critical, dev dependencies included
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 7 }

  e2e:
    name: End-to-end and accessibility (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "playwright-report\ntest-results", retention-days: 14 }
