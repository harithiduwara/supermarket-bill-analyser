name: User story
description: Propose a capability, written as a story with testable acceptance criteria
labels: [story]
body:
  - type: input
    id: persona
    attributes: { label: Who is this for?, placeholder: "P1 household bookkeeper / P2 reviewer" }
    validations: { required: true }
  - type: textarea
    id: story
    attributes: { label: Story, description: "As a …, I want … so that …" }
    validations: { required: true }
  - type: textarea
    id: criteria
    attributes:
      {
        label: Acceptance criteria,
        description: "Given / when / then — each one must be testable",
        placeholder: "- Given …, when …, then …",
      }
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes: { label: Priority (MoSCoW), options: [Must, Should, Could, Won't (this release)] }
    validations: { required: true }
  - type: textarea
    id: risks
    attributes:
      {
        label: Risks / what could mislead the user,
        description: "Anything that could make a number look more certain than it is",
      }
